name: Channel validation

# Manual, not on push. This measures rather than checks: it needs an AMR-NB
# encoder the test runners do not otherwise install, it takes minutes, and its
# output is a research artefact rather than a pass/fail signal. Running it on
# every push would spend the time and bury the result.
#
# It exists because the development machine has no ffmpeg build carrying AMR-NB,
# which is why every absolute figure in docs/H1-acoustic-results.md is scoped
# "through this parametric model". A GitHub runner has one an apt-get away.
#
# The tag trigger is the same deliberate act as pressing the button, expressed as
# a push. It matters because the development environment cannot reach
# api.github.com, so `gh workflow run` and the Actions tab are both unavailable
# from where the work is done, while plain git over SSH is not. A tag named
# channel-validation-* is never pushed by accident and never pushed twice.
on:
  workflow_dispatch:
    inputs:
      # These defaults apply to the button only. A tag push carries no inputs,
      # so the `||` fallbacks in the measure step are what a tagged run uses,
      # and the two have to be kept in step — the third run measured six
      # recordings rather than twenty-four because only this one was raised.
      max_recordings:
        description: "Recordings to measure"
        default: "48"
      max_seconds:
        description: "Seconds of each recording"
        default: "30"
  push:
    tags:
      - "channel-validation-*"

# Needed to commit the report back. Contents is the only scope granted, and the
# job writes exactly one file.
permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      # main explicitly, not the triggering ref. A tag push checks out a detached
      # head, and the report has to be committed back somewhere a clone will see
      # it.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # The whole reason this job exists: a runner can install the encoder the
      # development machine lacks.
      #
      # `ffmpeg` alone is not enough, and the first run of this workflow proved
      # it — it reported no AMR-NB encoder at all. Debian and Ubuntu build
      # libavcodec twice: the default package omits the patent-encumbered and
      # GPLv3 codecs, and `libavcodec-extra` is the flavour carrying them,
      # opencore-amr among them. Installing ffmpeg without it gets a working
      # ffmpeg that cannot do the one thing it was installed for.
      #
      # Printed rather than merely installed, so the log records what was
      # actually present — though the log is not readable from the environment
      # that triggers this, which is why the report itself now carries the same
      # probe.
      - name: Install an AMR-NB capable ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libavcodec-extra libopencore-amrnb-dev
          echo "--- AMR encoders visible to ffmpeg ---"
          ffmpeg -hide_banner -encoders | grep -i amr || echo "NONE"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[experiments,dev]"

      # The corpus is not in the repository and must not be. The comparison is
      # one coder against another over identical input, so it needs
      # representative speech rather than a corpus — but "representative" has to
      # include more than one voice, which the first run did not: it measured
      # six utterances from a single chapter of a single speaker. Eight speakers
      # here, and `select_recordings` takes them round-robin. Deterministic
      # throughout, so the sample is the same on every run.
      - name: Fetch a minimal speech sample
        run: |
          python -m scripts.fetch_corpus \
            --max-speakers 16 \
            --chapters-per-speaker 2 \
            --utterances-per-chapter 6

      # The script exits non-zero when no encoder is available, which is the
      # correct behaviour and must not abort the run: "there is no encoder here
      # either" is itself a result worth committing. The status is captured and
      # re-raised at the end so the job's own outcome still tells the truth.
      - name: Measure
        id: measure
        run: |
          set +e
          python -m scripts.validate_channel \
            --audio data/corpus/librispeech \
            --pattern '*.flac' \
            --max-recordings "${{ inputs.max_recordings || '48' }}" \
            --max-seconds "${{ inputs.max_seconds || '30' }}" \
            --output data/reports/channel_validation.json > measure.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat measure.log

      # The committed report is the only channel back to the development machine,
      # which cannot reach api.github.com and therefore cannot read this log or
      # download an artefact. So every run has to leave a trace, and the first
      # attempt at that did not work.
      #
      # It wrote a failure report only when the report file was missing — and
      # the report file is force-added, so a checkout always provides one. Two
      # runs then crashed inside the measurement, left the checked-out report
      # untouched, and the commit step correctly reported "unchanged" and
      # committed nothing. Silence, again, and this time it looked exactly like
      # a slow run.
      #
      # The status file fixes it by construction: it carries the run id, so it
      # differs on every run and is always committed. Silence now means one
      # thing only — the job never reached this step.
      - name: Record what this run actually did
        if: always()
        continue-on-error: true
        run: |
          mkdir -p data/reports
          MEASURE_STATUS="${{ steps.measure.outputs.status }}" \
          MEASURE_OUTCOME="${{ steps.measure.outcome }}" \
          JOB_STATUS="${{ job.status }}" \
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          RUN_SHA="${{ github.sha }}" \
          python - <<'PY'
          import json, os, pathlib

          log = pathlib.Path("measure.log")
          status = os.environ.get("MEASURE_STATUS", "")
          pathlib.Path("data/reports/channel_validation_status.json").write_text(
              json.dumps(
                  {
                      "run": os.environ["RUN_URL"],
                      "commit": os.environ["RUN_SHA"],
                      "measure_exit_status": status or "step did not reach its exit",
                      "measure_step_outcome": os.environ.get("MEASURE_OUTCOME", ""),
                      "job_status_so_far": os.environ.get("JOB_STATUS", ""),
                      # 0 measured against a reference coder, 3 ran correctly
                      # and found no encoder. Anything else is a crash — 1 in
                      # particular, which is what an uncaught exception exits
                      # with, and which is why "no encoder" is not 1. The tail
                      # is the only way to see the difference from a machine
                      # that cannot read this job's log.
                      "measurement_succeeded": status in {"0", "3"},
                      "log_tail": log.read_text(encoding="utf-8", errors="replace")
                      .splitlines()[-40:]
                      if log.exists()
                      else ["the measure step produced no log"],
                  },
                  indent=2,
              ),
              encoding="utf-8",
          )
          PY
          cat data/reports/channel_validation_status.json

      # Committed rather than left as an artefact only. Downloading an artefact
      # and retyping a table is how a figure gets carried into a context it does
      # not hold in, which this project has recorded twice — §12 read a
      # back-end training size as a whole training resource, and §14 ported a
      # bias shift measured at 42 speakers onto a result computed on 102. A
      # number that arrives by commit is the number that was measured.
      #
      # Force-added by name: data/ is ignored so that evidence cannot reach the
      # history by accident, and two named reports are not a reason to relax that.
      - name: Commit the report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Tolerant per file. `git add` on a path that does not exist fails the
          # whole step, and this step failing is precisely the outcome that
          # leaves the development machine with nothing to look at.
          for report in channel_validation channel_validation_status; do
            git add -f "data/reports/$report.json" || echo "no $report.json to add"
          done
          if git diff --cached --quiet; then
            echo "nothing to commit, which should now be impossible"
          else
            git commit -m "Measure the real AMR-NB coder against the parametric model

          Produced by the channel-validation workflow on a runner with
          libopencore-amrnb, which the development machine does not have."
            git pull --rebase --autostash
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: channel-validation
          path: |
            data/reports/channel_validation.json
            data/reports/channel_validation_status.json
            measure.log

      # Last, so the report is committed either way. A run that found no encoder
      # has still recorded something useful and should still be red.
      - name: Report whether a reference coder was actually found
        run: |
          if [ "${{ steps.measure.outputs.status }}" != "0" ]; then
            echo "::error::no AMR-NB encoder was available, so no validation was made"
            exit 1
          fi
