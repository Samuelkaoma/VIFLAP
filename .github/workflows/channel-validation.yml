name: Channel validation

# Manual, not on push. This measures rather than checks: it needs an AMR-NB
# encoder the test runners do not otherwise install, it takes minutes, and its
# output is a research artefact rather than a pass/fail signal. Running it on
# every push would spend the time and bury the result.
#
# It exists because the development machine has no ffmpeg build carrying AMR-NB,
# which is why every absolute figure in docs/H1-acoustic-results.md is scoped
# "through this parametric model". A GitHub runner has one an apt-get away.
#
# The tag trigger is the same deliberate act as pressing the button, expressed as
# a push. It matters because the development environment cannot reach
# api.github.com, so `gh workflow run` and the Actions tab are both unavailable
# from where the work is done, while plain git over SSH is not. A tag named
# channel-validation-* is never pushed by accident and never pushed twice.
on:
  workflow_dispatch:
    inputs:
      max_recordings:
        description: "Recordings to measure"
        default: "6"
      max_seconds:
        description: "Seconds of each recording"
        default: "30"
  push:
    tags:
      - "channel-validation-*"

# Needed to commit the report back. Contents is the only scope granted, and the
# job writes exactly one file.
permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      # main explicitly, not the triggering ref. A tag push checks out a detached
      # head, and the report has to be committed back somewhere a clone will see
      # it.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # The whole reason this job exists: a runner can install the encoder the
      # development machine lacks.
      #
      # `ffmpeg` alone is not enough, and the first run of this workflow proved
      # it — it reported no AMR-NB encoder at all. Debian and Ubuntu build
      # libavcodec twice: the default package omits the patent-encumbered and
      # GPLv3 codecs, and `libavcodec-extra` is the flavour carrying them,
      # opencore-amr among them. Installing ffmpeg without it gets a working
      # ffmpeg that cannot do the one thing it was installed for.
      #
      # Printed rather than merely installed, so the log records what was
      # actually present — though the log is not readable from the environment
      # that triggers this, which is why the report itself now carries the same
      # probe.
      - name: Install an AMR-NB capable ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libavcodec-extra libopencore-amrnb-dev
          echo "--- AMR encoders visible to ffmpeg ---"
          ffmpeg -hide_banner -encoders | grep -i amr || echo "NONE"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[experiments,dev]"

      # The corpus is not in the repository and must not be. Two speakers is
      # ample: the comparison is one coder against another over identical input,
      # so it needs representative speech rather than a corpus. The selection is
      # deterministic, so the sample is the same on every run.
      - name: Fetch a minimal speech sample
        run: |
          python -m scripts.fetch_corpus \
            --max-speakers 2 \
            --chapters-per-speaker 2 \
            --utterances-per-chapter 6

      # The script exits non-zero when no encoder is available, which is the
      # correct behaviour and must not abort the run: "there is no encoder here
      # either" is itself a result worth committing. The status is captured and
      # re-raised at the end so the job's own outcome still tells the truth.
      - name: Measure
        id: measure
        run: |
          set +e
          python -m scripts.validate_channel \
            --audio data/corpus/librispeech \
            --pattern '*.flac' \
            --max-recordings "${{ inputs.max_recordings || '6' }}" \
            --max-seconds "${{ inputs.max_seconds || '30' }}" \
            --output data/reports/channel_validation.json
          echo "status=$?" >> "$GITHUB_OUTPUT"

      # The committed report is the only channel back to the development machine,
      # which cannot reach api.github.com and therefore cannot read this log or
      # download an artefact. A run that died before measuring anything must
      # still leave something behind, or silence there is indistinguishable from
      # a run that is merely slow.
      - name: Record a failure the same way as a result
        if: always()
        run: |
          if [ ! -f data/reports/channel_validation.json ]; then
            mkdir -p data/reports
            cat > data/reports/channel_validation.json <<JSON
          {
            "available": false,
            "reached_measurement": false,
            "measure_step_outcome": "${{ steps.measure.outcome }}",
            "run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "notes": [
              "the workflow failed before writing a report; nothing was measured"
            ]
          }
          JSON
          fi

      # Committed rather than left as an artefact only. Downloading an artefact
      # and retyping a table is how a figure gets carried into a context it does
      # not hold in, which this project has recorded twice — §12 read a
      # back-end training size as a whole training resource, and §14 ported a
      # bias shift measured at 42 speakers onto a result computed on 102. A
      # number that arrives by commit is the number that was measured.
      #
      # Force-added by name: data/ is ignored so that evidence cannot reach the
      # history by accident, and one named report is not a reason to relax that.
      - name: Commit the report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/reports/channel_validation.json
          if git diff --cached --quiet; then
            echo "the report is unchanged from the committed one"
          else
            git commit -m "Measure the real AMR-NB coder against the parametric model

          Produced by the channel-validation workflow on a runner with
          libopencore-amrnb, which the development machine does not have."
            git pull --rebase --autostash
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: channel-validation
          path: data/reports/channel_validation.json

      # Last, so the report is committed either way. A run that found no encoder
      # has still recorded something useful and should still be red.
      - name: Report whether a reference coder was actually found
        run: |
          if [ "${{ steps.measure.outputs.status }}" != "0" ]; then
            echo "::error::no AMR-NB encoder was available, so no validation was made"
            exit 1
          fi
